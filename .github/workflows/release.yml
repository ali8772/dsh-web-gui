name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run check
      - name: Pack and checksum
        run: |
          npm pack
          sha256sum dsh-whale-pet-*.tgz > SHA256SUMS.txt
          tar -tzf dsh-whale-pet-*.tgz | tee package-files.txt
          ! grep -E '(e2e-|screens/|windows/|src/|\.map$|credentials|session\.jsonl)' package-files.txt
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dsh-whale-pet-*.tgz
            SHA256SUMS.txt
