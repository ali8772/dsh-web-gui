name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run check
      - name: Audit package
        run: |
          npm pack --dry-run
          npm pack
          tar -tzf dsh-whale-pet-*.tgz | tee package-files.txt
          ! grep -E '(e2e-|screens/|windows/|src/|\.map$|credentials|session\.jsonl)' package-files.txt
