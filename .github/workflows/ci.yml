name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Run tests
        shell: bash
        run: |
          set +e
          output="$(npm test 2>&1)"
          status=$?
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            compact="$(printf '%s' "$output" | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')"
            echo "::error file=test/balance-spend.test.mjs,title=npm test failed::$compact"
            exit "$status"
          fi
      - run: npm run check
      - name: Audit package
        run: |
          npm pack --dry-run
          npm pack
          tar -tzf dsh-whale-pet-*.tgz | tee package-files.txt
          ! grep -E '(e2e-|screens/|windows/|src/|\.map$|credentials|session\.jsonl)' package-files.txt
