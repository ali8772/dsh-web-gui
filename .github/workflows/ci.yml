name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  companions:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Validate Rust companion
        shell: bash
        run: |
          cargo fmt --manifest-path windows-rust/Cargo.toml --check
          cargo check --manifest-path windows-rust/Cargo.toml --locked
          cargo test --manifest-path windows-rust/Cargo.toml --locked
          cargo clippy --manifest-path windows-rust/Cargo.toml --locked -- -D warnings
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate PowerShell pairing contract
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path windows/WhaleMaidPet.ps1), [ref]$null, [ref]$errors)
          if ($errors.Count -gt 0) { $errors | Format-List | Out-String | Write-Error; exit 1 }
          node --test test/companion-client.test.mjs

  build-and-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - name: Run tests
        shell: bash
        run: |
          set +e
          output="$(npm test 2>&1)"
          status=$?
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            compact="$(printf '%s' "$output" | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')"
            echo "::error file=test/balance-spend.test.mjs,title=npm test failed::$compact"
            exit "$status"
          fi
      - run: npm run check
      - run: npm run check:size
      - run: npm run audit:prod
      - name: Audit package
        run: |
          npm pack --dry-run
          npm pack
          tar -tzf dsh-whale-pet-*.tgz | tee package-files.txt
          ! grep -E '(e2e-|screens/|windows/|src/|\.map$|credentials|session\.jsonl)' package-files.txt
