[package]
name = "whale-pet-rust"
version = "0.1.0"
edition = "2021"
description = "Experimental Rust rewrite of the dsh-whale-pet Windows companion"
license = "MIT"

[lib]
name = "whale_pet_rust"
path = "src/lib.rs"

[[bin]]
name = "whale-pet"
path = "src/main.rs"

[dependencies]
# Async runtime + HTTP server / client
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "net", "sync"] }
axum = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tower = "0.5"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Time / error
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
thiserror = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Misc
anyhow = "1"

# GUI (cross-platform; Windows transparent window via win32 in cfg(windows))
egui = "0.29"
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
] }

[dev-dependencies]
tokio = { version = "1.40", features = ["macros", "rt-multi-thread", "time"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"